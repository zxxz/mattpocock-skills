name: Validate plugin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-plugin-version
      - run: npm run check:codex
      - run: npm run test:codex
      - run: node --test scripts/sync-upstream.test.mjs
      - name: Validate Claude plugin and marketplace
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.246 plugin validate . --strict
          npx --yes @anthropic-ai/claude-code@2.1.246 plugin validate .claude-plugin/plugin.json
