name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require fork App credentials
        if: github.repository == 'zxxz/mattpocock-skills'
        env:
          APP_CLIENT_ID: ${{ vars.CODEX_SYNC_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CODEX_SYNC_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Set CODEX_SYNC_APP_CLIENT_ID and CODEX_SYNC_PRIVATE_KEY following .agents/codex-sync.md so release PR validation runs unattended.'
            exit 1
          fi

      - name: Create fork release token
        if: github.repository == 'zxxz/mattpocock-skills'
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CODEX_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEX_SYNC_PRIVATE_KEY }}
          owner: zxxz
          repositories: mattpocock-skills
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create Version Pull Request
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset tag
          commit: "chore: version skills"
          title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
